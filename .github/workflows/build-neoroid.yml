name: Build Neoroid 0.1 APK
run-name: Neoroid 0.1 test build

on:
  workflow_dispatch:
  push:
    branches:
      - neoroid-update-01
    paths:
      - "Neoroid-GitHub-Ready.zip"
      - ".github/workflows/build-neoroid.yml"
      - ".github/scripts/prepare_neoroid.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Neoroid
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f Neoroid-GitHub-Ready.zip
          mkdir -p source
          unzip -q Neoroid-GitHub-Ready.zip -d source
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          test -n "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Apply Neoroid branding and welcome setup
        run: python3 .github/scripts/prepare_neoroid.py "$PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDefaultRelease --stacktrace

      - name: Upload Neoroid APK
        uses: actions/upload-artifact@v4
        with:
          name: neoroid-0.1-release-apk
          path: ${{ env.PROJECT_DIR }}/app/app/build/outputs/apk/default/release/*.apk
          if-no-files-found: error
          retention-days: 14
