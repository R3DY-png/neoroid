name: Build Neoroid APK

on:
  workflow_dispatch:
  push:
    branches:
      - neoroid-build-workflow
    paths:
      - "Neoroid-GitHub-Ready.zip"
      - ".github/workflows/build-neoroid.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Neoroid
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f Neoroid-GitHub-Ready.zip || {
            echo "Neoroid-GitHub-Ready.zip was not found in the repository root."
            exit 1
          }
          mkdir -p source
          unzip -q Neoroid-GitHub-Ready.zip -d source
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper (gradlew) was found in the ZIP."
            echo "Archive contents:"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neoroid-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
